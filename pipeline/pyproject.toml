[project]
name = "alaap-pipeline"
version = "0.1.0"
description = "Data pipeline for Alaap — scrape, normalize, and load golden era film music data into Neo4j"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.27.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-slugify>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]
